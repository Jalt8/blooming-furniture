  </defs>
  <rect width="1200" height="800" fill="url(#antiqueBg)"/>
  <circle cx="200" cy="150" r="80" fill="url(#goldAccent)" opacity="0.3"/>
  <circle cx="1000" cy="650" r="100" fill="url(#goldAccent)" opacity="0.3"/>
  <rect x="150" y="200" width="900" height="400" fill="#F5F0E8" opacity="0.95" rx="15"/>
  <text x="600" y="350" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#3E2723" text-anchor="middle">
